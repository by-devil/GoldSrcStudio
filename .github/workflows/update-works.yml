name: Update maps and skyboxes

on:
  schedule:
    - cron: "17 4 * * *"   # every day at 04:17 UTC (07:17 Turkey time)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/update_works.py
      - run: python .github/scripts/build_pages.py   # refreshes the counts in the root README
      - name: Commit if anything changed
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update maps and skyboxes"
          git push
