name: Harita ve skybox verilerini güncelle

on:
  schedule:
    - cron: "17 4 * * *"   # her gün 04:17 UTC (07:17 TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/update_works.py
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- maps skies; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add maps skies
          git commit -m "Harita ve skybox verilerini güncelle"
          git push
