name: Publish tool releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create one release per tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          for t in json.load(open('tools/tools.json', encoding='utf-8')):
              if '/tools/' not in t['download']:
                  continue
              path = 'tools/' + t['download'].split('/tools/', 1)[1]
              tag = t['slug'] + '-' + re.sub(r'[^a-z0-9.]+', '-', t['version'].lower()).strip('-')
              if subprocess.run(['gh', 'release', 'view', tag], capture_output=True).returncode == 0:
                  print('exists', tag)
                  continue
              notes = f"{t['en']['summary']}\n\n{t['summary']}\n\nhttps://tools.bydevil.com/tools/{t['slug']}/"
              subprocess.run(['gh', 'release', 'create', tag, path, '--title', f"{t['name']} {t['version']}",
                              '--notes', notes, '--target', os.environ['GITHUB_SHA']], check=True)
              print('created', tag)
          PY
