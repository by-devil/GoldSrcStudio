name: Fetch kit screenshots

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download screenshots from bydevil.com
        run: |
          get() { mkdir -p "kits/$1/img"; curl -fsSL -A "Mozilla/5.0" -o "kits/$1/img/$2.jpg" "https://bydevil.com/assets/kits/$2.jpg"; }
          get sigdir sigdir-1; get sigdir sigdir-2
          for r in 1920 1024 800 640; do get motd-fit motdfit-$r; done
          get csduragi-trident trident-once; get csduragi-trident trident-sonra
      - name: Commit
        run: |
          git add kits
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add MOTD kit screenshots"
          git push
